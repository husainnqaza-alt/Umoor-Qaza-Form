:root{
  --bg:#f6f5f1;--surface:#ffffff;--text:#1f2a24;--muted:#66716a;--line:#dcdad2;
  --accent:#1f6f54;--accent-soft:#dff0e8;--accent-text:#ffffff;--bad:#b3261e;
  --gold:#d2a63c;--gold-fill:rgba(210,166,60,.14);--gold-text:#8a6508;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141815;--surface:#1d231f;--text:#e8ece9;--muted:#9aa59e;--line:#323a35;
    --accent:#58b894;--accent-soft:#1f3a2f;--accent-text:#0d1a14;--bad:#f08a82;--gold-text:#ecc861}
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Space Grotesk","KanzCustom",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic","Geeza Pro",sans-serif;
  font-synthesis:none;line-height:1.5;font-size:16px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;margin:0 0 14px;font-weight:400}
#intro{display:block;background:var(--gold-fill);color:var(--gold-text);border:2px solid var(--gold);border-radius:16px;
  padding:26px 24px;margin:0 0 24px;font-size:1.45rem;line-height:2;text-align:center}
#intro:empty{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.q{margin:0 0 20px}
.q.hidden{display:none}
.lbl{display:block;margin:0 0 6px;font-size:1.2rem;font-weight:400}
.snum{font-family:"KanzCustom";font-size:1.15em}
.opt{color:var(--muted);font-size:.8rem;margin:0 6px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:1.05rem;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer}
.choices input{accent-color:var(--accent)}
.choices label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--bad);font-size:.88rem;margin-top:5px;display:none}
.q.invalid .err{display:block}
.q.invalid input[type=text],.q.invalid input[type=number],.q.invalid select{border-color:var(--bad)}
.btn{font:inherit;border:0;border-radius:10px;padding:12px 24px;background:var(--accent);color:var(--accent-text);cursor:pointer;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.msg{color:var(--muted)}
.msg.bad{color:var(--bad)}
.done{text-align:center;padding:28px 12px}
.done .big{font-size:2.2rem}
.hp{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
.hidden{display:none!important}
[dir=rtl] .opt{margin-left:0}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div id="intro"></div>

  <div id="thanks" class="card done hidden">
    <div class="big">✓</div>
    <h2 id="thanks-h" style="font-weight:400"></h2>
    <p class="msg" id="thanks-d"></p>
    <button class="btn ghost" id="edit-again" type="button"></button>
  </div>

  <div id="formcard" class="card">
    <div class="q" data-q="jamiyat">
      <label class="lbl" for="f-jamiyat" id="ul-jamiyat"></label>
      <input type="text" id="f-jamiyat" list="jamiyat-list" autocomplete="off">
      <datalist id="jamiyat-list"></datalist>
      <select id="f-jamiyat-sel" class="hidden"><option value="">—</option></select>
      <div class="msg" id="list-note" style="font-size:.85rem;margin-top:4px"></div>
      <div class="err"></div>
    </div>
    <div class="q hidden" data-q="mauze">
      <label class="lbl" for="f-mauze" id="ul-mauze"></label>
      <select id="f-mauze"><option value="">—</option></select>
      <div class="err"></div>
    </div>
    <div class="q" data-q="name">
      <label class="lbl" for="f-name" id="ul-name"></label>
      <input type="text" id="f-name" autocomplete="name">
      <div class="err"></div>
    </div>
    <div id="qs"></div>
    <input class="hp" type="text" id="f-website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="row">
      <button class="btn" id="submit" type="button"></button>
      <span id="submit-msg" class="msg"></span>
    </div>
  </div>
</div>

<script>
(function(){

var SB_URL=String(window.QAZA_SUPABASE_URL||'').replace(/\/+$/,''),SB_KEY=window.QAZA_SUPABASE_KEY||'';

var CONFIG={

    },
    {

};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function slug(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function isInt(v){return v!==''&&v!=null&&/^\d+$/.test(String(v).trim())}
function hasOpts(t){return t==='choice'||t==='select'}
var UI=CONFIG.ui||{};
function U(k,def){return (UI[k]&&String(UI[k]).trim())||def}
var REQUIRED_MSG=U('required','يرجى الإجابة على هذا السؤال');
var lists=[];

/* ---------- static text and direction ---------- */
document.title=CONFIG.title||'Form';
$('title').textContent=CONFIG.title||'';
$('intro').textContent=CONFIG.intro||'';
if(CONFIG.rtl){
  document.documentElement.dir='rtl';
}
$('ul-jamiyat').textContent=U('jamiyat','Jamiyat');
$('ul-mauze').textContent=U('mauze','Mauze');

$('thanks-h').textContent=U('thanks','Thank you');
$('edit-again').textContent=U('edit','Edit my response');
Array.prototype.forEach.call(document.querySelectorAll('.err'),function(e){e.textContent=REQUIRED_MSG});

function arNum(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}

/* ---------- questions ---------- */
function renderQuestions(){
  var h='';
  CONFIG.questions.forEach(function(q,i){
    var lab='<span class="snum">'+arNum(i+1)+'.</span> '+esc(q.label)+(q.required?'':'<span class="opt">(optional)</span>');
    var err='<div class="err">'+esc(REQUIRED_MSG)+'</div>',body;
    if(q.type==='choice'){
      body='<div class="choices">'+(q.options||[]).map(function(o){return '<label><input type="radio" name="r-'+q.id+'" value="'+esc(o)+'"> '+esc(o)+'</label>'}).join('')+'</div>';
      h+='<div class="q" data-qid="'+q.id+'"><span class="lbl">'+lab+'</span>'+body+err+'</div>';
      return;
    }
    if(q.type==='select')body='<select id="qa-'+q.id+'"><option value="">—</option>'+(q.options||[]).map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>';
    else if(q.type==='number')body='<input type="number" id="qa-'+q.id+'" min="0" step="1" inputmode="numeric">';
    else if(q.type==='long')body='<textarea id="qa-'+q.id+'"></textarea>';
    else body='<input type="text" id="qa-'+q.id+'">';
    h+='<div class="q" data-qid="'+q.id+'"><label class="lbl" for="qa-'+q.id+'">'+lab+'</label>'+body+err+'</div>';
  });
  $('qs').innerHTML=h;
}
renderQuestions();

function readAnswer(q){
  if(q.type==='choice'){var r=document.querySelector('input[name="r-'+q.id+'"]:checked');return r?r.value:''}
  var el=$('qa-'+q.id);return el?el.value:'';
}

function updateMauze(){
  var box=document.querySelector('[data-q="mauze"]'),sel=$('f-mauze');
  var jn=slug($('f-jamiyat').value),g=null;
  for(var i=0;i<lists.length;i++){if(slug(lists[i].name)===jn){g=lists[i];break}}
  var list=(g&&g.mauze)||[];
  if(!list.length){box.classList.add('hidden');sel.innerHTML='<option value="">—</option>';return}
  var cur=sel.value;
  sel.innerHTML='<option value="">—</option>'+list.map(function(m){return '<option>'+esc(m)+'</option>'}).join('');
  sel.value=list.indexOf(cur)>=0?cur:'';
  box.classList.remove('hidden');
}
$('f-jamiyat').addEventListener('input',updateMauze);
$('f-jamiyat').addEventListener('change',updateMauze);

function loadLists(){
  var note=$('list-note');
  if(!configured()){note.textContent='The form is not connected to the database yet.';return}
  fetch(SB_URL+'/rest/v1/directory?select=jamiyat,mauze&order=jamiyat.asc&limit=5000',{headers:sbHeaders()}).then(function(r){
    if(!r.ok)throw new Error('http');return r.json();
  }).then(function(rows){
    var map={},order=[];
    rows.forEach(function(r){
      var j=String(r.jamiyat||'').trim(),m=String(r.mauze||'').trim();
      if(!j)return;
      if(!map[j]){map[j]={};order.push(j)}
      if(m)map[j][m]=true;
    });
    lists=order.map(function(j){return {name:j,mauze:Object.keys(map[j]).sort(function(a,b){return a.localeCompare(b)})}});
    if(!lists.length){note.textContent='The jamiyat list is empty. Please type your jamiyat.';return}
    $('jamiyat-list').innerHTML=lists.map(function(j){return '<option value="'+esc(j.name)+'">'}).join('');
    var sel=$('f-jamiyat-sel');
    sel.innerHTML='<option value="">—</option>'+lists.map(function(j){return '<option>'+esc(j.name)+'</option>'}).join('');
    sel.classList.remove('hidden');$('f-jamiyat').classList.add('hidden');
    note.textContent='';
    updateMauze();
  }).catch(function(){note.textContent='Could not load the jamiyat list. Please type your jamiyat.'});
}
$('f-jamiyat-sel').addEventListener('change',function(){$('f-jamiyat').value=this.value;updateMauze()});
loadLists();

/* ---------- submit ---------- */
function mark(box,bad){if(box)box.classList.toggle('invalid',!!bad)}
$('submit').onclick=async function(){
  var msg=$('submit-msg');msg.className='msg';msg.textContent='';
  var jam=$('f-jamiyat').value.trim(),nm=$('f-name').value.trim(),bad=false;
  mark(document.querySelector('[data-q="jamiyat"]'),!jam);if(!jam)bad=true;
  var mbox=document.querySelector('[data-q="mauze"]'),mz=$('f-mauze').value,needM=!mbox.classList.contains('hidden');
  mark(mbox,needM&&!mz);if(needM&&!mz)bad=true;
  mark(document.querySelector('[data-q="name"]'),!nm);if(!nm)bad=true;
  var answers=[],a={};
  CONFIG.questions.forEach(function(q){
    var v=readAnswer(q),box=document.querySelector('[data-qid="'+q.id+'"]'),ok=true;
    var empty=(v===''||v==null||String(v).trim()==='');
    if(q.required&&empty)ok=false;
    if(ok&&q.type==='number'&&!empty&&!isInt(v))ok=false;
    a[q.id]=v;
    mark(box,!ok);if(!ok)bad=true;
    answers.push({id:q.id,label:q.label,value:q.type==='number'?(empty?'':Number(v)):(typeof v==='string'?v.trim():v)});
  });
  if(a.implemented!==undefined&&isInt(a.implemented)&&isInt(a.qazaya)&&Number(a.implemented)>Number(a.qazaya)){
    bad=true;mark(document.querySelector('[data-qid="implemented"]'),true);
  }
  if(bad){
    msg.className='msg bad';msg.textContent=REQUIRED_MSG;
    var f=document.querySelector('.q.invalid');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(!configured()){msg.className='msg bad';msg.textContent='The form is not connected to the database yet.';return}
  var btn=$('submit');btn.disabled=true;msg.textContent='…';
  try{
    if(!$('f-website').value){
      var res=await fetch(SB_URL+'/rest/v1/rpc/submit_response',{method:'POST',headers:sbHeaders(),
        body:JSON.stringify({p_form:window.QAZA_FORM_ID,p_jamiyat:jam,p_mauze:needM?mz:'',p_name:nm,p_answers:answers})});
      if(!res.ok){var tx='';try{tx=await res.text()}catch(e2){}throw new Error(tx||'failed')}
    }
    msg.textContent='';
    $('thanks-d').textContent=jam+(needM&&mz?' · '+mz:'');
    $('formcard').classList.add('hidden');$('thanks').classList.remove('hidden');window.scrollTo(0,0);
  }catch(e){
    msg.className='msg bad';
    msg.textContent=/closed/i.test(String(e&&e.message))?U('closed','This form is closed.'):'Could not send. Please check your internet and try again.';
  }
  btn.disabled=false;
};
$('edit-again').onclick=function(){
  $('thanks').classList.add('hidden');$('formcard').classList.remove('hidden');$('submit-msg').textContent='';
};
})();
</script>
